<text x='20.0' y='428.0' font-size='11.5' fill='#5c6675' text-anchor='start'>The 0.85 rung is the tallest bar and it is not in production: at 0.85 the head node had 1.9 GiB of free host RAM and 1.6 GB of swap in use.</text>
<text x='20.0' y='444.0' font-size='11.5' fill='#5c6675' text-anchor='start'>On a unified-memory machine free host RAM is the safety margin, and the rule is 4 GiB. A pool you cannot serve from is not a pool.</text>
<text x='20.0' y='460.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Production 9 gained its 10 % without moving the fraction at all: a full-scope checkpoint consumes 3.4 GiB less per node.</text>
