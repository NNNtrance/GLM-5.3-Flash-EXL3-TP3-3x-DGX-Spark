<text x='20.0' y='61.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Source: results/configs/kv-pool-progression.csv, which carries every reading including the ones not plotted here.</text>
<text x='20.0' y='76.0' font-size='11.5' fill='#5c6675' text-anchor='start'>max_model_len is 1,000,000, so the right-hand axis is how many full-length requests the pool holds at once.</text>
