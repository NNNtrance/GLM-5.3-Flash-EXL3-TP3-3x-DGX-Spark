<text x='20.0' y='446.0' font-size='11.5' fill='#5c6675' text-anchor='start'>The grey 0.85 bar was published as a rejected rung, on free host RAM against a 4 GiB rule. That ruler was wrong and the rejection is retracted (docs/11 section 2.4):</text>
<text x='20.0' y='462.0' font-size='11.5' fill='#5c6675' text-anchor='start'>the 6 September ladder re-climbed it against SWAP TRAFFIC UNDER LOAD instead - 0.85, 0.87 and 0.88 all pass, and 0.90 is the rejected rung, 1,519 MiB out and 143 MiB back in.</text>
<text x='20.0' y='478.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Production 12 is 0.88 plus the sparse-indexer workspace bound: 7,041,322 tokens, 4.3x production 1's pool. The 0.90 bar is measured and must not be quoted as an achievable pool.</text>
