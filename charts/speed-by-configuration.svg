<text x='20.0' y='428.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Configuration 9 is the only step that changed the checkpoint rather than a flag, an image or the fabric, and it is the largest single move here:</text>
<text x='20.0' y='444.0' font-size='11.5' fill='#5c6675' text-anchor='start'>+22.9 % at C1 and +12.5 % at C8 against configuration 8. Draft acceptance is unchanged once pooled by draft token (the 2.4-point gap first published was a harness artefact); the cost is a second patch tree.</text>
<text x='20.0' y='460.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Image tag under each pair is the cuda-exl3 commit that configuration was built from.</text>
