<text x='20.0' y='28.0' font-size='17' fill='#1c2430' text-anchor='start' font-weight='600'>Decode throughput by production configuration</text>
<text x='20.0' y='46.0' font-size='11.5' fill='#5c6675' text-anchor='start'>12 short English code prompts (hizset-v2), realistic not synthetic. TP=3 + expert parallelism, EXL3 4bpw, KV fp8, DFlash2 k=7,</text>
<text x='20.0' y='61.0' font-size='11.5' fill='#5c6675' text-anchor='start'>temperature 0, reasoning effort low. gpu-memory-utilization is 0.80 through configuration 9, then 0.83 / 0.87 / 0.88 - the memory</text>
<text x='20.0' y='76.0' font-size='11.5' fill='#5c6675' text-anchor='start'>rungs 10, 11 and 12 climbed. Configurations 1-8 serve a routed-experts-only checkpoint, 9 onwards a full-scope one.</text>
<text x='20.0' y='91.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Source: results/configs/production-configurations.csv. 5-6 September 2026.</text>
