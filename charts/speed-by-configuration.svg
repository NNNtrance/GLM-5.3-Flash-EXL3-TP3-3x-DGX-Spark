<text x='20.0' y='46.0' font-size='11.5' fill='#5c6675' text-anchor='start'>12 short English code prompts (hizset-v2), realistic not synthetic. TP=3 + expert parallelism, EXL3 4bpw, KV fp8, DFlash2 k=7,</text>
