<text x='20.0' y='428.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Configuration 9 is the only step that changed the checkpoint rather than a flag, an image or the fabric, and it is the largest single move here:</text>
<text x='20.0' y='444.0' font-size='11.5' fill='#5c6675' text-anchor='start'>+22.9 % at C1 and +12.5 % at C8 against configuration 8. Draft acceptance is unchanged once pooled by draft token (the 2.4-point gap first</text>
<text x='20.0' y='460.0' font-size='11.5' fill='#5c6675' text-anchor='start'>published was a harness artefact); the cost is a second patch tree.</text>
<text x='20.0' y='476.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Configurations 10, 11 and 12 are memory work, not speed work: they buy KV pool (5.62M -&gt; 6.38M -&gt; 7.04M) with every level inside its band.</text>
<text x='20.0' y='492.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Image tag under each pair is the cuda-exl3 commit that configuration was built from. The KV chart is where 10, 11 and 12 are read.</text>
</svg>
