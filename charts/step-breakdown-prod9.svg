<text x='20.0' y='391.0' font-size='11.5' fill='#5c6675' text-anchor='start'>The row this configuration was built to delete: the unquantized dense stage was 45.3 % of a C1 decode step on production 7, and is 25.9 % here -</text>
<text x='20.0' y='407.0' font-size='11.5' fill='#5c6675' text-anchor='start'>42.90 ms down to 21.90 ms. That -21 ms is the whole of the +22 %: draft acceptance is unchanged when pooled by draft token, so nothing else moved.</text>
<text x='20.0' y='423.0' font-size='11.5' fill='#5c6675' text-anchor='start'>Read two numbers with care: NCCL and CPU-gap at C1 are inflated by CUPTI (2,738 kernel launches per step). With the profiler off the two</text>
<text x='20.0' y='439.0' font-size='11.5' fill='#5c6675' text-anchor='start'>together are &lt;= 17.19 ms rather than 29.1. The NCCL class is 100 % exposed either way: measured comm/compute overlap is 0.00 ms.</text>
